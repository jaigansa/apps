<!DOCTYPE html>
<html lang="ta">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TamCalc - தமிழ் கணிப்பொறி</title>
  <link rel="manifest" href="website.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:image" content="https://raw.githubusercontent.com/jaigansa/webapps/master/tamilcalc/assets/png/banner.png" />
  
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="calc-wrapper">
    <div class="calc-card">

      <!-- Header Toolbar -->
      <header class="app-header">
        <h1 class="app-title">
          <i class="bi bi-calculator-fill"></i>
          <span>தமிழ் கணிப்பொறி</span>
        </h1>
        <div class="header-actions">
          <button class="action-btn" onclick="copyTamilResult()" title="தமிழ் விடையை நகலெடு (Copy Tamil Result)">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
      </header>

      <!-- Compact Dual Display -->
      <div class="display-container">
        <div id="expression-line" class="expression-line"></div>

        <!-- Tamil Numeral Output -->
        <div class="tamil-display-group">
          <span class="badge-tamil"><i class="bi bi-translate me-1"></i>தமிழ்</span>
          <input type="text" id="tam-dis" class="tamil-value border-0 bg-transparent" value="௦" readonly aria-label="tamil-display">
        </div>

        <!-- English Digits Input / Output -->
        <div class="digits-display-group">
          <span class="badge-digits"><i class="bi bi-123 me-1"></i>Digits</span>
          <input type="text" id="io-display" class="digits-value border-0 bg-transparent" value="0" readonly aria-label="digits-display">
        </div>
      </div>

      <!-- Keypad Grid -->
      <div class="calc-grid">
        <!-- Row 1: Clear, Delete, Modulo, Division -->
        <button class="calc-btn btn-danger" data-key="clr" onclick="clr()" title="முழுதும் அழி (Clear)">
          <i class="bi bi-x-diamond-fill"></i>
        </button>
        <button class="calc-btn btn-danger" data-key="del" onclick="del()" title="அழி (Backspace)">
          <span class="tam-sub">அழி</span>
          <span class="eng-main"><i class="bi bi-backspace"></i></span>
        </button>
        <button class="calc-btn btn-op" data-key="%" onclick="display('%')">
          <span class="eng-main">%</span>
        </button>
        <button class="calc-btn btn-op" data-key="/" onclick="display('/')">
          <span class="eng-main">÷</span>
        </button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button class="calc-btn btn-num" data-key="7" onclick="display('7')">
          <span class="tam-sub">௭</span>
          <span class="eng-main">7</span>
        </button>
        <button class="calc-btn btn-num" data-key="8" onclick="display('8')">
          <span class="tam-sub">௮</span>
          <span class="eng-main">8</span>
        </button>
        <button class="calc-btn btn-num" data-key="9" onclick="display('9')">
          <span class="tam-sub">௯</span>
          <span class="eng-main">9</span>
        </button>
        <button class="calc-btn btn-op" data-key="*" onclick="display('*')">
          <span class="eng-main">×</span>
        </button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button class="calc-btn btn-num" data-key="4" onclick="display('4')">
          <span class="tam-sub">௪</span>
          <span class="eng-main">4</span>
        </button>
        <button class="calc-btn btn-num" data-key="5" onclick="display('5')">
          <span class="tam-sub">௫</span>
          <span class="eng-main">5</span>
        </button>
        <button class="calc-btn btn-num" data-key="6" onclick="display('6')">
          <span class="tam-sub">௬</span>
          <span class="eng-main">6</span>
        </button>
        <button class="calc-btn btn-op" data-key="-" onclick="display('-')">
          <span class="eng-main">-</span>
        </button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button class="calc-btn btn-num" data-key="1" onclick="display('1')">
          <span class="tam-sub">௧</span>
          <span class="eng-main">1</span>
        </button>
        <button class="calc-btn btn-num" data-key="2" onclick="display('2')">
          <span class="tam-sub">௨</span>
          <span class="eng-main">2</span>
        </button>
        <button class="calc-btn btn-num" data-key="3" onclick="display('3')">
          <span class="tam-sub">௩</span>
          <span class="eng-main">3</span>
        </button>
        <button class="calc-btn btn-op" data-key="+" onclick="display('+')">
          <span class="eng-main">+</span>
        </button>

        <!-- Row 5: Dec, 0, Equals -->
        <button class="calc-btn btn-num" data-key="." onclick="display('.')">
          <span class="eng-main">.</span>
        </button>
        <button class="calc-btn btn-num" data-key="0" onclick="display('0')">
          <span class="tam-sub">௦</span>
          <span class="eng-main">0</span>
        </button>
        <button class="calc-btn btn-eq" data-key="=" onclick="calculate()">
          <span class="tam-sub">விடை</span>
          <span class="eng-main">=</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast-msg" class="toast-msg"></div>

  <!-- Compact Footer -->
  <footer>
    <div class="social-links mb-2">
      <a href="https://fb.com/jaigansa" target="_blank" rel="noopener"><i class="bi bi-facebook"></i></a>
      <a href="https://www.twitter.com/jaigansa" target="_blank" rel="noopener"><i class="bi bi-twitter"></i></a>
      <a href="https://www.instagram.com/jaigansa" target="_blank" rel="noopener"><i class="bi bi-instagram"></i></a>
      <a href="https://linkedin.com/in/jaigansa" target="_blank" rel="noopener"><i class="bi bi-linkedin"></i></a>
      <a href="https://github.com/jaigansa" target="_blank" rel="noopener"><i class="bi bi-github"></i></a>
    </div>
    <div>
      Created by <a href="https://jaigansa.github.io" class="text-reset text-decoration-underline fw-semibold" target="_blank">JAIGANESH</a>
    </div>
  </footer>

  <script src="script/main.js"></script>
</body>

</html>
